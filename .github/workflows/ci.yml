name: ci

# Fast checks on every branch and pull request. The book's own `make check` is the gate;
# artifact builds run in the release workflow. This sample also runs its editorial `make full`
# and uploads a review-only edition preview, which the template `ci.yml` does not need.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Fast checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the pinned toolkit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Release builds compact the PDF with qpdf 11 or later; install it here too so a
      # `make build` or `make full` in this workflow behaves like the release workflow.
      - name: Install qpdf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf
          test "$(qpdf --version | head -1 | cut -d' ' -f3 | cut -d. -f1)" -ge 11

      - name: Run the fast checks
        run: make check

      # The sample-specific contract: the book config must keep Quarto numbering and execution
      # explicit, and the editorial checks must pass for every chapter and appendix.
      - name: Validate build config syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("publishing/_quarto.yml").read_text())
          assert config["project"]["type"] == "book"
          assert set(config["format"]) >= {"html", "typst", "docx"}
          assert config["number-sections"] is False
          assert config["execute"]["enabled"] is False
          print("build config syntax: OK")
          PY

      - name: Run full checks
        run: make full

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.11.9"

      - name: Install edition inspection tools
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils libreoffice-writer

      - name: Build the edition preview for review
        run: |
          VERSION="$(python -c 'import yaml; print(yaml.safe_load(open("publishing/metadata.yaml"))["version"])')"
          handbook-toolkit build-book \
            --repo "$GITHUB_WORKSPACE" \
            --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/edition-preview" \
            --version "$VERSION-preview" \
            --preview \
            --require-page-numbers

      - name: Upload the edition preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edition-preview
          path: ${{ runner.temp }}/edition-preview
          if-no-files-found: error
          retention-days: 14
