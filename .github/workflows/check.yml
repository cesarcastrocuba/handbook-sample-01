name: repository-check

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned toolkit
        run: python -m pip install -r requirements.txt

      - name: Validate build config syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path("publishing/_quarto.yml").read_text())
          assert config["project"]["type"] == "book"
          assert set(config["format"]) >= {"html", "typst", "docx"}
          assert config["number-sections"] is False
          assert config["execute"]["enabled"] is False
          print("build config syntax: OK")
          PY

      - name: Run full checks
        run: make full

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.11.9"

      - name: Install edition inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils libreoffice-writer

      - name: Build the edition preview for review
        run: |
          VERSION="$(python -c 'import yaml; print(yaml.safe_load(open("publishing/metadata.yaml"))["version"])')"
          handbook-toolkit build-book \
            --repo "$GITHUB_WORKSPACE" \
            --commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/edition-preview" \
            --version "$VERSION-preview" \
            --preview \
            --require-page-numbers

      - name: Upload the edition preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edition-preview
          path: ${{ runner.temp }}/edition-preview
          if-no-files-found: error
          retention-days: 14
