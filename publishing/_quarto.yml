# Book-side Quarto configuration.
#
# This file is consumed by the Hub build in an isolated staged workspace.
# It is not rendered directly from the repository root: the Hub generates
# index.qmd and chapter wrappers from book.yaml and manuscript/book.yml.
# Package, manifest and checksum logic intentionally live in the Hub toolkit.
project:
  type: book
  output-dir: _output

book:
  title: "Handbook Authoring and Publishing"
  subtitle: "A practical guide to planning, writing, reviewing and sustaining a technical handbook"
  author: "Franz César Castro Cuba"
  date: "2026-11-06"
  search: true
  repo-url: "https://github.com/cesarcastrocuba/handbook-sample-01"
  repo-actions: [issue]
  navbar:
    right:
      - text: "Handbook Hub"
        href: "https://cesarcastrocuba.github.io/handbooks-hub/"
      - text: "Tables"
        href: "tables.html"
      - text: "Source"
        href: "https://github.com/cesarcastrocuba/handbook-sample-01/tree/main/manuscript"
      - text: "Downloads"
        href: "https://github.com/cesarcastrocuba/handbook-sample-01/releases"
lang: en
number-sections: false

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
  typst:
    papersize: a4
    toc: true
    toc-depth: 2
  docx:
    toc: true
    toc-depth: 3

execute:
  enabled: false
